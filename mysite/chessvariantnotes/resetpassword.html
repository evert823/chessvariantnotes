<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password - chessvariantnotes</title>
  <link rel="icon" href="/images/myicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="./css/chessvariantnotes.css">
</head>
<body>
  <div id="authArea"></div>

  <h1>Set new password</h1>

  <form id="resetForm">
    <label for="passwordInput">New password</label><br>
    <input id="passwordInput" type="password" autocomplete="new-password"><br><br>

    <button id="resetBtn" type="submit">Set password</button>
  </form>

  <div id="resetMsg" role="status" style="margin-top:12px;"></div>

  <script type="module">
    import { renderAuthArea } from './js/auth.js';
    import { initResetPassword } from './js/resetpassword.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await renderAuthArea();
      initResetPassword({
        formId: 'resetForm',
        passwordId: 'passwordInput',
        buttonId: 'resetBtn',
        messageId: 'resetMsg'
      });
    });
  </script>
</body>
</html>
