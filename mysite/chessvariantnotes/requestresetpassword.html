<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - chessvariantnotes</title>
  <link rel="icon" href="/images/myicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="./css/chessvariantnotes.css">
</head>
<body>
  <div id="authArea"></div>

  <h1>Reset password</h1>

  <form id="requestResetForm">
    <label for="emailInput">Email</label><br>
    <input id="emailInput" type="email" required><br><br>

    <button id="resetBtn" type="submit">Send reset link</button>
  </form>

  <div id="resetMsg" role="status" style="margin-top:12px;"></div>

  <script type="module">
    import { renderAuthArea } from './js/auth.js';
    import { initRequestResetPassword } from './js/requestresetpassword.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await renderAuthArea();
      initRequestResetPassword({
        formId: 'requestResetForm',
        emailId: 'emailInput',
        buttonId: 'resetBtn',
        messageId: 'resetMsg'
      });
    });
  </script>
</body>
</html>
